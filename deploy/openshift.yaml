apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmware-local-rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llmware-local-rag
  template:
    metadata:
      labels:
        app: llmware-local-rag
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: YOUR_REGISTRY/llmware-local-rag:1.0.0
          ports:
            - containerPort: 8080
          env:
            - name: LLMWARE_DEMO_MODEL_NAME
              value: bling-answer-tool
          resources:
            requests:
              cpu: "2"
              memory: 6Gi
            limits:
              cpu: "4"
              memory: 12Gi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: model-cache
              mountPath: /opt/app-root/src/llmware_data
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: llmware-model-cache
---
apiVersion: v1
kind: Service
metadata:
  name: llmware-local-rag
spec:
  selector:
    app: llmware-local-rag
  ports:
    - port: 8080
      targetPort: 8080
